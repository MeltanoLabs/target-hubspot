[tool.poetry]
name = "target-hubspot"
version = "0.0.1"
description = "`target-hubspot` is a Singer target for HubSpot, built with the Meltano Singer SDK."
readme = "README.md"
authors = ["Pat Nadolny"]
keywords = [
    "ELT",
    "HubSpot",
]
license = "Apache-2.0"

[tool.poetry.dependencies]
python = ">=3.9"
hubspot-api-client = "~=11.1.0"
singer-sdk = { version="~=0.45.0" }
fs-s3fs = { version = "^1.1.1", optional = true }
requests = "~=2.32.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8"
singer-sdk = { version="~=0.45.0", extras = ["testing"] }

[tool.poetry.extras]
s3 = ["fs-s3fs"]

[tool.ruff]
target-version = "py39"
src = ["target_hubspot"]

[tool.ruff.lint]
select = ["ALL"]

[tool.ruff.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.isort]
known-first-party = ["target_hubspot"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[build-system]
requires = ["poetry-core>=1.0.8"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
# CLI declaration
target-hubspot = 'target_hubspot.target:TargetHubSpot.cli'
