[tool.poetry]
name = "target-hubspot"
version = "0.0.1"
description = "`target-hubspot` is a Singer target for HubSpot, built with the Meltano Singer SDK."
readme = "README.md"
authors = ["Pat Nadolny"]
keywords = [
    "ELT",
    "HubSpot",
]
license = "Apache-2.0"

[tool.poetry.dependencies]
python = ">=3.10"
singer-sdk = "~=0.54.9"
hubspot-api-client = "~=13.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.1"
singer-sdk = { version = "~=0.54.9", extras = ["testing"] }

[tool.ruff]
ignore = [
    "ANN101",  # missing-type-self
    "ANN102",  # missing-type-cls
]
select = ["ALL"]
src = ["target_hubspot"]
target-version = "py310"

[tool.ruff.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.isort]
known-first-party = ["target_hubspot"]

[tool.ruff.pydocstyle]
convention = "google"

[build-system]
requires = ["poetry-core>=1.0.8"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
# CLI declaration
target-hubspot = 'target_hubspot.target:TargetHubSpot.cli'
